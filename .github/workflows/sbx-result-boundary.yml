name: SBX result boundary integration
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: sbx-result-boundary
  cancel-in-progress: false
jobs:
  generate:
    if: github.ref == 'refs/heads/main' && github.actor == 'dvdksn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Verify KVM and install pinned SBX
      env:
        SBX_DEB: ${{ runner.temp }}/sbx.deb
      run: "set -euo pipefail\ntest -c /dev/kvm || { echo '::error::Hosted runner has no KVM device'; exit 1; }\nsudo setfacl\
        \ -m \"u:$(id -un):rw\" /dev/kvm\ntest -r /dev/kvm && test -w /dev/kvm\ncurl --fail --silent --show-error --location\
        \ \\\n  https://github.com/docker/sbx-releases/releases/download/v0.48.0-rc4/DockerSandboxes-linux-amd64-ubuntu2404.deb\
        \ \\\n  --output \"$SBX_DEB\"\nprintf '%s  %s\\n' d2a3d90545f7fe242b6bf412ce2afe198cda33f399e2612b91a3418bf13a96e3\
        \ \"$SBX_DEB\" | sha256sum --check\nsudo apt-get update -qq\nsudo apt-get install -y \"$SBX_DEB\"\nsbx version\n"
    - name: Initialize sandbox policy and authenticate
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
      run: "set -euo pipefail\ntest -n \"$DOCKER_USERNAME\" && test -n \"$DOCKER_PAT\"\nsbx policy init deny-all\nprintf '%s'\
        \ \"$DOCKER_PAT\" | sbx login --username \"$DOCKER_USERNAME\" --password-stdin\nfor attempt in 1 2 3; do\n  if sbx\
        \ settings set kit.allowedSources '[\"docker.io/\", \"ghcr.io/dvdksn/\"]'; then\n    break\n  fi\n  test \"$attempt\"\
        \ -lt 3 || exit 1\n  sleep 3\ndone\n"
    - name: Generate proposals in sandbox and tamper producer checkout
      id: task
      uses: dvdksn/sbx-action@cee08d9d4974d9926d168e5080ccb9d6ad3a3f59
      with:
        kit: ghcr.io/dvdksn/kit-base@sha256:a9c00cc0e65477904073ef6f3f9036fcb95b74c0397a3bd9879598ea81df3588
        results: "valid:\n  path: proposals/valid.json\n  max-bytes: 65536\nempty:\n  path: proposals/empty.json\n  max-bytes:\
          \ 65536\nfabricated:\n  path: proposals/fabricated.json\n  max-bytes: 65536\noutside:\n  path: proposals/outside.json\n\
          \  max-bytes: 65536\nextra:\n  path: proposals/extra.json\n  max-bytes: 65536\nexcess:\n  path: proposals/excess.json\n\
          \  max-bytes: 65536\ntampered:\n  path: proposals/tampered.json\n  max-bytes: 65536\n"
        run: "set -eu\npython3 - <<'PYTHON'\nimport json\nfrom pathlib import Path\nPath('proposals').mkdir(exist_ok=True)\n\
          finding = {'file': 'content/boundary-example.md',\n           'quote': 'The original repository contains this sentence.',\n\
          \           'title': 'Review this statement', 'explanation': 'A deterministic test proposal.'}\ncases = {\n    'valid':\
          \ [finding],\n    'empty': [],\n    'fabricated': [{**finding, 'quote': 'This sentence does not exist.'}],\n   \
          \ 'outside': [{**finding, 'file': 'README.md'}],\n    'extra': [{**finding, 'command': 'echo should-never-run'}],\n\
          \    'excess': [finding] * 6,\n    'tampered': [{**finding, 'quote': 'Injected evidence from the workload.'}],\n\
          }\nfor name, findings in cases.items():\n    Path('proposals', name + '.json').write_text(json.dumps({'version':\
          \ 1, 'findings': findings}))\n# This mutation must not become evidence in the fresh validator job.\nPath('content/boundary-example.md').write_text('Injected\
          \ evidence from the workload.\\n')\nPYTHON"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: boundary-proposals
        path: ${{ steps.task.outputs.results-path }}
        if-no-files-found: error
        retention-days: 1
  validate:
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
        - case: valid
          expected: success
          count: 1
        - case: empty
          expected: success
          count: 0
        - case: fabricated
          expected: failure
          count: 0
        - case: outside
          expected: failure
          count: 0
        - case: extra
          expected: failure
          count: 0
        - case: excess
          expected: failure
          count: 0
        - case: tampered
          expected: failure
          count: 0
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: boundary-proposals
        path: ${{ runner.temp }}/boundary-proposals
    - name: Validate against original source
      id: validate
      continue-on-error: true
      uses: dvdksn/sbx-action/validate-findings@cee08d9d4974d9926d168e5080ccb9d6ad3a3f59
      with:
        findings-file: ${{ runner.temp }}/boundary-proposals/${{ matrix.case }}.json
        source-root: ${{ github.workspace }}
        allowed-path-prefix: content
        max-findings: '5'
    - name: Assert deterministic boundary outcome
      env:
        ACTUAL: ${{ steps.validate.outcome }}
        EXPECTED: ${{ matrix.expected }}
        COUNT: ${{ steps.validate.outputs.count }}
        EXPECTED_COUNT: ${{ matrix.count }}
      run: "set -euo pipefail\ntest \"$ACTUAL\" = \"$EXPECTED\"\nif [ \"$EXPECTED\" = success ]; then\n  test \"$COUNT\" =\
        \ \"$EXPECTED_COUNT\"\nelse\n  test -z \"$COUNT\"\nfi\nprintf 'Boundary outcome matched: %s\\n' \"$ACTUAL\""
