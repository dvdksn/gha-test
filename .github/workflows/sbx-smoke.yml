name: SBX agent smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sbx-smoke
  cancel-in-progress: false
jobs:
  claude:
    if: github.ref == 'refs/heads/main' && github.actor == 'dvdksn'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dvdksn/sbx-action@ef8a1dcb72ce5377149558f2b3c93ca4c174b883
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-token: ${{ secrets.DOCKER_PAT }}
          environment-file: sbx-claude.yaml
          credentials: |
            anthropic: ${{ toJSON(secrets.ANTHROPIC_API_KEY) }}
          run: >-
            claude -p --model haiku --max-budget-usd 0.25
            --dangerously-skip-permissions
            "Read README.md and summarize this repository. Do not modify files."
            > summary.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: claude-summary
          path: summary.md
          if-no-files-found: error
  codex:
    if: github.ref == 'refs/heads/main' && github.actor == 'dvdksn'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dvdksn/sbx-action@ef8a1dcb72ce5377149558f2b3c93ca4c174b883
        with:
          docker-username: ${{ secrets.DOCKER_USERNAME }}
          docker-token: ${{ secrets.DOCKER_PAT }}
          environment-file: sbx-codex.yaml
          credentials: |
            openai: ${{ toJSON(secrets.OPENAI_API_KEY) }}
          run: >-
            codex exec --ephemeral --sandbox workspace-write -o summary.md
            "Read README.md and summarize this repository. Do not modify files."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-summary
          path: summary.md
          if-no-files-found: error
