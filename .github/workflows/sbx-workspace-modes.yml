name: SBX workspace modes integration
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: sbx-workspace-modes
  cancel-in-progress: false
jobs:
  workspace:
    if: github.ref == 'refs/heads/main' && github.actor == 'dvdksn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        clone:
        - 'false'
        - 'true'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Verify bundled setup with built-in workload
      uses: dvdksn/sbx-action@272f331e560dbc68f9f64aa04bc6e123b3be802c
      with:
        environment-file: sbx-claude.yaml
        docker-username: ${{ secrets.DOCKER_USERNAME }}
        docker-token: ${{ secrets.DOCKER_PAT }}
        run: 'true'
    - name: Configure custom kit source policy
      run: "set -euo pipefail\nsbx policy init deny-all\nfor attempt in 1 2 3; do\n  if sbx settings set kit.allowedSources\
        \ '[\"docker.io/\", \"ghcr.io/dvdksn/\"]'; then\n    break\n  fi\n  test \"$attempt\" -lt 3 || exit 1\n\
        \  sleep 3\ndone\n"
    - name: Run SBX with selected workspace mode
      id: task
      uses: dvdksn/sbx-action@272f331e560dbc68f9f64aa04bc6e123b3be802c
      with:
        kit: ghcr.io/dvdksn/kit-base@sha256:a9c00cc0e65477904073ef6f3f9036fcb95b74c0397a3bd9879598ea81df3588
        clone: ${{ matrix.clone }}
        run: "set -eu\npython3 - <<'PYTHON'\nimport errno\nfrom pathlib import Path\nclone = '${{ matrix.clone }}'\
          \ == 'true'\noriginal = Path('/run/sandbox/source/content/boundary-example.md')\nif clone:\n    assert\
          \ 'The original repository contains this sentence.' in original.read_text()\n    try:\n        original.write_text('This\
          \ write must fail')\n    except OSError as error:\n        assert error.errno in {errno.EROFS, errno.EACCES,\
          \ errno.EPERM}\n    else:\n        raise AssertionError('Original source was writable')\nPath('content/boundary-example.md').write_text('Workload\
          \ edit\\n')\nPath('workspace-mode.txt').write_text('Workload output\\n')\nPYTHON"
        docker-username: ${{ secrets.DOCKER_USERNAME }}
        docker-token: ${{ secrets.DOCKER_PAT }}
    - name: Verify workspace behavior and cleanup
      env:
        CLONE: ${{ matrix.clone }}
        SANDBOX: ${{ steps.task.outputs.sandbox-name }}
      run: "set -euo pipefail\npython3 - <<'PYTHON'\nimport os\nimport re\nfrom pathlib import Path\nassert re.fullmatch(r'gha-[a-f0-9]{20}',\
        \ os.environ['SANDBOX'])\nif os.environ['CLONE'] == 'true':\n    assert 'The original repository contains\
        \ this sentence.' in Path('content/boundary-example.md').read_text()\n    assert not Path('workspace-mode.txt').exists()\n\
        else:\n    assert Path('content/boundary-example.md').read_text() == 'Workload edit\\n'\n    assert Path('workspace-mode.txt').read_text()\
        \ == 'Workload output\\n'\nPYTHON\ntest -z \"$(find \"$RUNNER_TEMP\" -maxdepth 1 -name 'sbx-action-*' !\
        \ -name 'sbx-action-python' -print -quit)\"\nsbx ls --format json > \"$RUNNER_TEMP/remaining-sandboxes.json\"\
        \npython3 -c 'import json,sys; assert not json.load(open(sys.argv[1]))' \"$RUNNER_TEMP/remaining-sandboxes.json\""
    - name: Upload direct-mode output using ordinary Actions tooling
      if: matrix.clone == 'false'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: workspace-output
        path: workspace-mode.txt
        if-no-files-found: error
