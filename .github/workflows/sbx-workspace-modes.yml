name: SBX workspace modes integration
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: sbx-workspace-modes
  cancel-in-progress: false
jobs:
  workspace:
    if: github.ref == 'refs/heads/main' && github.actor == 'dvdksn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        clone:
        - 'false'
        - 'true'
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Verify KVM and install pinned SBX
      env:
        SBX_DEB: ${{ runner.temp }}/sbx.deb
      run: |
        set -euo pipefail
        test -c /dev/kvm || { echo '::error::Hosted runner has no KVM device'; exit 1; }
        sudo setfacl -m "u:$(id -un):rw" /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm
        curl --fail --silent --show-error --location \
          https://github.com/docker/sbx-releases/releases/download/v0.48.0-rc4/DockerSandboxes-linux-amd64-ubuntu2404.deb \
          --output "$SBX_DEB"
        printf '%s  %s\n' d2a3d90545f7fe242b6bf412ce2afe198cda33f399e2612b91a3418bf13a96e3 "$SBX_DEB" | sha256sum --check
        sudo apt-get update -qq
        sudo apt-get install -y "$SBX_DEB"
        sbx version
    - name: Initialize sandbox policy and authenticate
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
      run: |
        set -euo pipefail
        test -n "$DOCKER_USERNAME" && test -n "$DOCKER_PAT"
        sbx policy init deny-all
        printf '%s' "$DOCKER_PAT" | sbx login --username "$DOCKER_USERNAME" --password-stdin
        for attempt in 1 2 3; do
          if sbx settings set kit.allowedSources '["docker.io/", "ghcr.io/dvdksn/"]'; then
            break
          fi
          test "$attempt" -lt 3 || exit 1
          sleep 3
        done
    - name: Run SBX with selected workspace mode
      id: task
      uses: dvdksn/sbx-action@ef8a1dcb72ce5377149558f2b3c93ca4c174b883
      with:
        kit: ghcr.io/dvdksn/kit-base@sha256:a9c00cc0e65477904073ef6f3f9036fcb95b74c0397a3bd9879598ea81df3588
        clone: ${{ matrix.clone }}
        run: |-
          set -eu
          python3 - <<'PYTHON'
          import errno
          from pathlib import Path
          clone = '${{ matrix.clone }}' == 'true'
          original = Path('/run/sandbox/source/content/boundary-example.md')
          if clone:
              assert 'The original repository contains this sentence.' in original.read_text()
              try:
                  original.write_text('This write must fail')
              except OSError as error:
                  assert error.errno in {errno.EROFS, errno.EACCES, errno.EPERM}
              else:
                  raise AssertionError('Original source was writable')
          Path('content/boundary-example.md').write_text('Workload edit\n')
          Path('workspace-mode.txt').write_text('Workload output\n')
          PYTHON
    - name: Verify workspace behavior and cleanup
      env:
        CLONE: ${{ matrix.clone }}
        SANDBOX: ${{ steps.task.outputs.sandbox-name }}
      run: |-
        set -euo pipefail
        python3 - <<'PYTHON'
        import os
        import re
        from pathlib import Path
        assert re.fullmatch(r'gha-[a-f0-9]{20}', os.environ['SANDBOX'])
        if os.environ['CLONE'] == 'true':
            assert 'The original repository contains this sentence.' in Path('content/boundary-example.md').read_text()
            assert not Path('workspace-mode.txt').exists()
        else:
            assert Path('content/boundary-example.md').read_text() == 'Workload edit\n'
            assert Path('workspace-mode.txt').read_text() == 'Workload output\n'
        PYTHON
        test -z "$(find "$RUNNER_TEMP" -maxdepth 1 -name 'sbx-action-*' ! -name 'sbx-action-python' -print -quit)"
        sbx ls --format json > "$RUNNER_TEMP/remaining-sandboxes.json"
        python3 -c 'import json,sys; assert not json.load(open(sys.argv[1]))' "$RUNNER_TEMP/remaining-sandboxes.json"
    - name: Upload direct-mode output using ordinary Actions tooling
      if: matrix.clone == 'false'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: workspace-output
        path: workspace-mode.txt
        if-no-files-found: error
