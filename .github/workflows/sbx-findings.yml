name: SBX opinionated findings integration
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: sbx-findings
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == 'refs/heads/main' && github.actor == 'dvdksn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - case: valid
          expected: success
          count: 1
        - case: empty
          expected: success
          count: 0
        - case: fabricated
          expected: failure
          count: 0
        - case: outside
          expected: failure
          count: 0
        - case: extra
          expected: failure
          count: 0
        - case: excess
          expected: failure
          count: 0
        - case: tampered
          expected: failure
          count: 0
        - case: symlink
          expected: failure
          count: 0
        - case: directory
          expected: failure
          count: 0
        - case: oversized
          expected: failure
          count: 0
        - case: missing
          expected: failure
          count: 0
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Verify KVM and install pinned SBX
      env:
        SBX_DEB: ${{ runner.temp }}/sbx.deb
      run: |
        set -euo pipefail
        test -c /dev/kvm || { echo '::error::Hosted runner has no KVM device'; exit 1; }
        sudo setfacl -m "u:$(id -un):rw" /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm
        curl --fail --silent --show-error --location \
          https://github.com/docker/sbx-releases/releases/download/v0.48.0-rc4/DockerSandboxes-linux-amd64-ubuntu2404.deb \
          --output "$SBX_DEB"
        printf '%s  %s\n' d2a3d90545f7fe242b6bf412ce2afe198cda33f399e2612b91a3418bf13a96e3 "$SBX_DEB" | sha256sum --check
        sudo apt-get update -qq
        sudo apt-get install -y "$SBX_DEB"
        sbx version
    - name: Initialize sandbox policy and authenticate
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
      run: |
        set -euo pipefail
        test -n "$DOCKER_USERNAME" && test -n "$DOCKER_PAT"
        sbx policy init deny-all
        printf '%s' "$DOCKER_PAT" | sbx login --username "$DOCKER_USERNAME" --password-stdin
        for attempt in 1 2 3; do
          if sbx settings set kit.allowedSources '["docker.io/", "ghcr.io/dvdksn/"]'; then
            break
          fi
          test "$attempt" -lt 3 || exit 1
          sleep 3
        done
    - name: Run isolated workload and validate findings automatically
      id: review
      continue-on-error: true
      uses: dvdksn/sbx-action@a7d43f76d76933a7d0c175b5f10864f6af087c7b
      with:
        kit: ghcr.io/dvdksn/kit-base@sha256:a9c00cc0e65477904073ef6f3f9036fcb95b74c0397a3bd9879598ea81df3588
        findings: content/
        run: |-
          set -eu
          python3 - <<'PYTHON'
          import errno
          import json
          from pathlib import Path
          case = '${{ matrix.case }}'
          original = Path('/run/sandbox/source/content/boundary-example.md')
          assert 'The original repository contains this sentence.' in original.read_text()
          try:
              original.write_text('This write must fail')
          except OSError as error:
              assert error.errno in {errno.EROFS, errno.EACCES, errno.EPERM}
          else:
              raise AssertionError('Original source was writable')
          Path('content/boundary-example.md').write_text('Injected evidence from the workload.\n')
          Path('clone-only.txt').write_text('This must not appear on the runner')
          Path('proposals').mkdir(exist_ok=True)
          target = Path('proposals/findings.json')
          finding = {'file': 'content/boundary-example.md',
                     'quote': 'The original repository contains this sentence.',
                     'title': 'Review this statement', 'explanation': 'A deterministic test proposal.'}
          if case == 'symlink':
              target.symlink_to('../content/boundary-example.md')
          elif case == 'directory':
              target.mkdir()
              (target / 'nested').write_text('Unexpected directory')
          elif case == 'oversized':
              target.write_bytes(b'x' * 65537)
          elif case == 'missing':
              pass
          else:
              findings = [finding]
              if case == 'empty':
                  findings = []
              elif case == 'fabricated':
                  findings = [{**finding, 'quote': 'This sentence does not exist.'}]
              elif case == 'tampered':
                  findings = [{**finding, 'quote': 'Injected evidence from the workload.'}]
              elif case == 'outside':
                  findings = [{**finding, 'file': 'README.md'}]
              elif case == 'extra':
                  findings = [{**finding, 'command': 'echo should-never-run'}]
              elif case == 'excess':
                  findings = [finding] * 6
              target.write_text(json.dumps({'version': 1, 'findings': findings}))
          PYTHON
    - name: Assert outcome and original checkout isolation
      env:
        ACTUAL: ${{ steps.review.outcome }}
        EXPECTED: ${{ matrix.expected }}
        COUNT: ${{ steps.review.outputs.findings-count }}
        EXPECTED_COUNT: ${{ matrix.count }}
        RESULTS: ${{ steps.review.outputs.results-path }}
        ARTIFACT: ${{ steps.review.outputs.artifact-name }}
      run: |-
        set -euo pipefail
        test "$ACTUAL" = "$EXPECTED"
        git diff --exit-code
        test ! -e clone-only.txt
        test ! -e proposals/findings.json
        if [ "$EXPECTED" = success ]; then
          test "$COUNT" = "$EXPECTED_COUNT"
          test -n "$ARTIFACT"
          test -f "$RESULTS/findings.json"
          test -f "$RESULTS/manifest.json"
        else
          test -z "$COUNT"
          test -z "$RESULTS"
          test -z "$ARTIFACT"
        fi
        # No sandbox or temporary extraction files should remain.
        test -z "$(find "$RUNNER_TEMP" -maxdepth 1 -name 'sbx-action-*' ! -name 'sbx-action-python' -print -quit)"
        sbx ls
        printf 'Clone isolation and findings outcome matched: %s\n' "$ACTUAL"
