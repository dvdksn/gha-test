name: SBX output collection integration
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: sbx-output
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main' && github.actor == 'dvdksn'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - case: file
          expected: success
          path: review.md
          files: 1
          bytes: 47
        - case: empty-file
          expected: success
          path: review.md
          files: 1
          bytes: 0
        - case: directory
          expected: success
          path: results/
          files: 2
          bytes: 35
        - case: binary
          expected: success
          path: review.md
          files: 1
          bytes: 4
        - case: aggregate
          expected: failure
          path: results/
          files: 1
          bytes: 0
        - case: oversized
          expected: failure
          path: results/
          files: 1
          bytes: 0
        - case: missing
          expected: failure
          path: review.md
          files: 1
          bytes: 0
        - case: symlink
          expected: failure
          path: review.md
          files: 1
          bytes: 0
        - case: linked-child
          expected: failure
          path: results/
          files: 1
          bytes: 0
        - case: hardlinks
          expected: failure
          path: results/
          files: 1
          bytes: 0
        - case: fifo
          expected: failure
          path: results/
          files: 1
          bytes: 0
        - case: too-many
          expected: failure
          path: results/
          files: 1
          bytes: 0
        - case: empty-directory
          expected: failure
          path: results/
          files: 1
          bytes: 0
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Verify KVM and install pinned SBX
      env:
        SBX_DEB: ${{ runner.temp }}/sbx.deb
      run: |
        set -euo pipefail
        test -c /dev/kvm || { echo '::error::Hosted runner has no KVM device'; exit 1; }
        sudo setfacl -m "u:$(id -un):rw" /dev/kvm
        test -r /dev/kvm && test -w /dev/kvm
        curl --fail --silent --show-error --location \
          https://github.com/docker/sbx-releases/releases/download/v0.48.0-rc4/DockerSandboxes-linux-amd64-ubuntu2404.deb \
          --output "$SBX_DEB"
        printf '%s  %s\n' d2a3d90545f7fe242b6bf412ce2afe198cda33f399e2612b91a3418bf13a96e3 "$SBX_DEB" | sha256sum --check
        sudo apt-get update -qq
        sudo apt-get install -y "$SBX_DEB"
        sbx version
    - name: Initialize sandbox policy and authenticate
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
      run: |
        set -euo pipefail
        test -n "$DOCKER_USERNAME" && test -n "$DOCKER_PAT"
        sbx policy init deny-all
        printf '%s' "$DOCKER_PAT" | sbx login --username "$DOCKER_USERNAME" --password-stdin
        for attempt in 1 2 3; do
          if sbx settings set kit.allowedSources '["docker.io/", "ghcr.io/dvdksn/"]'; then
            break
          fi
          test "$attempt" -lt 3 || exit 1
          sleep 3
        done
    - name: Run workload and collect ordinary output
      id: task
      continue-on-error: true
      uses: dvdksn/sbx-action@39fb53b324b72c2e7a37ae2ac77cfd1d2c1aea0d
      with:
        kit: ghcr.io/dvdksn/kit-base@sha256:a9c00cc0e65477904073ef6f3f9036fcb95b74c0397a3bd9879598ea81df3588
        output-path: ${{ matrix.path }}
        output-max-bytes: 64
        run: |-
          set -eu
          python3 - <<'PYTHON'
          import errno
          import os
          from pathlib import Path
          case = '${{ matrix.case }}'
          original = Path('/run/sandbox/source/content/boundary-example.md')
          assert 'The original repository contains this sentence.' in original.read_text()
          try:
              original.write_text('This write must fail')
          except OSError as error:
              assert error.errno in {errno.EROFS, errno.EACCES, errno.EPERM}
          else:
              raise AssertionError('Original source was writable')
          Path('content/boundary-example.md').write_text('Clone-only edits.\n')
          Path('clone-only.txt').write_text('This must not appear on the runner')
          if case == 'file':
              Path('review.md').write_text('An ordinary review, without a findings schema.\n')
          elif case == 'empty-file':
              Path('review.md').touch()
          elif case == 'binary':
              Path('review.md').write_bytes(bytes([0, 1, 255, 254]))
          elif case == 'symlink':
              Path('review.md').symlink_to('content/boundary-example.md')
          elif case != 'missing':
              root = Path('results'); root.mkdir()
              if case == 'directory':
                  (root / 'nested').mkdir()
                  (root / 'nested/review.md').write_text('Plain text review')
                  (root / '.context').write_text('Supporting context')
              elif case == 'aggregate':
                  (root / 'a').write_bytes(b'x' * 40)
                  (root / 'b').write_bytes(b'x' * 40)
              elif case == 'oversized':
                  (root / 'a').write_bytes(b'x' * 65)
              elif case == 'linked-child':
                  (root / 'link').symlink_to('../content', target_is_directory=True)
              elif case == 'hardlinks':
                  (root / 'a').write_text('data'); os.link(root / 'a', root / 'b')
              elif case == 'fifo':
                  os.mkfifo(root / 'pipe')
              elif case == 'too-many':
                  for index in range(1001): (root / str(index)).touch()
          PYTHON
    - name: Assert output boundaries and checkout isolation
      env:
        ACTUAL: ${{ steps.task.outcome }}
        EXPECTED: ${{ matrix.expected }}
        FILES: ${{ steps.task.outputs.output-files }}
        EXPECTED_FILES: ${{ matrix.files }}
        BYTES: ${{ steps.task.outputs.output-bytes }}
        EXPECTED_BYTES: ${{ matrix.bytes }}
        OUTPUT: ${{ steps.task.outputs.output-directory }}
        ARTIFACT: ${{ steps.task.outputs.artifact-name }}
        CASE: ${{ matrix.case }}
      run: |-
        set -euo pipefail
        test "$ACTUAL" = "$EXPECTED"
        git diff --exit-code
        test ! -e clone-only.txt
        test ! -e review.md
        test ! -e results
        if [ "$EXPECTED" = success ]; then
          test "$FILES" = "$EXPECTED_FILES"
          test "$BYTES" = "$EXPECTED_BYTES"
          test -n "$ARTIFACT"
          if [ "$CASE" = directory ]; then
            test -f "$OUTPUT/results/nested/review.md"
            test -f "$OUTPUT/results/.context"
          else
            test -f "$OUTPUT/review.md"
          fi
        else
          test -z "$FILES"
          test -z "$BYTES"
          test -z "$OUTPUT"
          test -z "$ARTIFACT"
          test -z "$(find "$RUNNER_TEMP" -maxdepth 1 -name 'sbx-output-*' -print -quit)"
        fi
        test -z "$(find "$RUNNER_TEMP" -maxdepth 1 -name 'sbx-action-*' ! -name 'sbx-action-python' -print -quit)"
        sbx ls --format json > "$RUNNER_TEMP/remaining-sandboxes.json"
        python3 -c 'import json,sys; assert not json.load(open(sys.argv[1]))' "$RUNNER_TEMP/remaining-sandboxes.json"
        printf 'Output boundaries and clone isolation matched: %s\n' "$ACTUAL"
